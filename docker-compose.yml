services:
  vesta:
    container_name: vesta
    image: ghcr.io/veirt/vesta:latest
    build: .
    ports:
      - 8450:3000
    environment:
      VESTA_CONFIG: /data/config.toml
      VESTA_DATABASE: /data/vesta.sqlite
    volumes:
      - vesta_data:/data
    restart: unless-stopped

volumes:
  vesta_data:
