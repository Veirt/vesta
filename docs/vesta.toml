# Copy this example to the path configured by VESTA_CONFIG, then customize it.
# Settings writes the same human-readable TOML format atomically.

[app]
dashboard_title = "Home lab"
theme = "system"

[[nodes]]
id = "self"
name = "This server"
hostname = "vesta.home.arpa"
device_name = "Mini PC"
endpoint = "local"
interval_secs = 15

[[nodes]]
id = "nas"
name = "NAS"
hostname = "nas.home.arpa"
device_name = "Synology NAS"
endpoint = "http://nas.home.arpa:9100/metrics"
interval_secs = 15

[groups.productivity]
name = "Productivity"

[[groups.productivity.services]]
title = "Clock"
x = 0
y = 0
width = 4
height = 2
widget.name = "Clock"

[[groups.productivity.services]]
title = "Quick links"
x = 4
y = 0
width = 8
height = 2
widget.name = "QuickLinks"
widget.config.links = [
  { title = "Vesta on GitHub", url = "https://github.com/veirt/vesta", icon = "https://github.githubassets.com/favicons/favicon.svg" },
  { title = "Synology", url = "https://nas.home.arpa", icon = "" },
]

[groups.monitoring]
name = "Monitoring"

[[groups.monitoring.services]]
title = "This server"
x = 0
y = 0
width = 6
height = 3
widget.name = "SystemStats"
widget.config.node = "self"
widget.config.refresh_interval = 5

[[groups.monitoring.services]]
title = "Weather"
x = 6
y = 0
width = 6
height = 3
widget.name = "Weather"
widget.config.latitude = "37.7749"
widget.config.longitude = "-122.4194"
widget.config.units = "fahrenheit"
widget.config.refresh_interval = "600"
