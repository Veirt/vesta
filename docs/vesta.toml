# Vesta example configuration.
#
# Nodes are monitoring targets polled on a fixed interval. `endpoint` is either
# `local` (read this host through sysinfo) or the URL of a node_exporter /
# Prometheus text-format metrics endpoint.

[[nodes]]
id = "self"
name = "This server"
endpoint = "local"
interval_secs = 15

[[nodes]]
id = "nas"
name = "NAS"
endpoint = "http://nas.lan:9100/metrics"
interval_secs = 15

[widgets]
name = "Widgets"
columns = 3
[[widgets.services]]
title = "QuickLinks"
widget.name = "QuickLinks"
widget.config.links = [
  { title = "GitHub", url = "https://github.com/veirt", icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/github.svg" },
  { title = "Personal Website", url = "https://veirt.is-a.dev", icon = "https://veirt.is-a.dev/favicon.ico" },
]
width = 1
height = 3
[[widgets.services]]
title = "Clock"
widget = { name = "Clock" }
width = 1
height = 3
[[widgets.services]]
title = "Weather"
widget = { name = "Weather", config = { latitude = "0.5016", longitude = "117.1265", units = "celsius", refresh_interval = "600" } }
width = 1
height = 3
[[widgets.services]]
title = "This server"
widget = { name = "SystemStats", config = { node = "self", refresh_interval = "5" } }
width = 3
height = 3
[[widgets.services]]
title = "NAS"
widget = { name = "SystemStats", config = { node = "nas", refresh_interval = "15" } }
width = 3
height = 3

[media]
name = "Media"
columns = 6

[[media.services]]
title = "Jellyfin"
href = "https://jellyfin.veirt.moe"
imgSrc = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/jellyfin.svg"
ping = { url = "https://jellyfin.veirt.moe" }
