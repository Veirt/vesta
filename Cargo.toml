[package]
name = "vesta"
version = "1.4.0"
edition = "2024"

resolver = "2"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock", "serde"], default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
maud = { version = "0.27.0", features = ["axum"] }
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "query"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
