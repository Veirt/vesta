[package]
name = "vesta"
version = "2.0.0"
edition = "2024"

resolver = "2"

[dependencies]
argon2 = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock", "serde"], default-features = false }
gix = { version = "0.76", default-features = false, features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "index"] }
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
moka = { version = "0.12.16", features = ["future"] }
prometheus-parse = "0.2.5"
reqwest = { version = "0.13.5", features = ["json", "rustls", "query"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sysinfo = "0.40.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
